name: Release

# Builds the release archives with tools/build_release.py on Windows (MSVC, static
# runtime) and Linux (GNU) and publishes them on the GitHub release for the tag. Each
# archive is also published without the version in its name (tmux-<target>.zip,
# tmux-<target>.tar.gz) so releases/latest/download/<name> always gets the latest.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (for example v0.2.0)
        required: true
      links_only:
        description: Do not rebuild; only add the version-less copies of the archives already on the release
        type: boolean
        default: false

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.97.1
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    if: ${{ !inputs.links_only }}
    strategy:
      fail-fast: true
      matrix:
        # ubuntu-22.04 keeps the Linux binary's glibc requirement low (2.35)
        include:
          - os: windows-2022
            python: python
          - os: ubuntu-22.04
            python: python3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc -vV
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$TAG" || { echo "tag $TAG does not match Cargo.toml version $version"; exit 1; }
      - name: Build release archive
        shell: bash
        run: ${{ matrix.python }} tools/build_release.py --output "$RUNNER_TEMP/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || (inputs.links_only && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.links_only }}
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the release
        if: ${{ !inputs.links_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "pwsh-tmux ${TAG#v}" --notes "Release archives built from $TAG by tools/build_release.py. Each archive has BUILDINFO.json and SHA256SUMS; the .sha256 files hold the archive checksums. See README.md and COMPATIBILITY.md."
          fi
      - name: Publish version-less copies
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir latest
          cd latest
          # Copy what is on the release, checked against its .sha256 files.
          gh release download "$TAG" --pattern "tmux-$version-*"
          sha256sum -c ./*.sha256
          rm ./*.sha256
          count=0
          for archive in tmux-"$version"-*; do
            stable="tmux-${archive#tmux-$version-}"
            mv "$archive" "$stable"
            sha256sum "$stable" > "$stable.sha256"
            count=$((count + 1))
          done
          test "$count" -eq 2 || { echo "expected 2 archives on $TAG, found $count"; exit 1; }
          ls -l
          gh release upload "$TAG" ./* --clobber
