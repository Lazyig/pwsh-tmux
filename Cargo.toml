[package]
name = "pwsh-tmux"
version = "0.3.0"
edition = "2024"
description = "A tmux-compatible terminal multiplexer for Windows (ConPTY) and Unix, with PowerShell as the default shell"
license = "MIT"
readme = "README.md"
keywords = ["tmux", "terminal", "multiplexer", "powershell", "conpty"]
categories = ["command-line-utilities"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossterm = "0.29.0"
fancy-regex = { version = "0.19.2", features = ["leftmost_longest"] }
interprocess = "2.4.7"
portable-pty = { version = "0.9.0", path = "vendor/portable-pty" }
unicode-width = "0.2.3"
vt100 = { version = "0.18.1", path = "vendor/vt100" }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
widestring = "1"
windows-sys = { version = "0.61.2", features = ["Win32_Globalization", "Win32_System_Console", "Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes"] }

# Bundled with a local change; see vendor/interprocess/PATCHES.md.
[patch.crates-io]
interprocess = { path = "vendor/interprocess" }
